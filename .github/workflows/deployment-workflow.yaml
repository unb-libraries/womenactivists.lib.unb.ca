name: Deploy womenactivists.lib.unb.ca

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  deploy:
    uses: unb-libraries/dockworker/.github/workflows/build-push-deploy-notify.yaml@6.x
    with:
      # prod only. The dev site is now the static Nuxt build from
      # unb-libraries/womenactivists.nuxt.lib.unb.ca, and its Helm release owns the
      # womenactivists-lib-unb-ca Deployment in the dev namespace. Since the container
      # name matches, a dev deploy from here would `kubectl set image` a Drupal image
      # onto that live Nuxt site and succeed. The prod branch keeps its own copy of this
      # file and still deploys prod.
      branch-env-map: '{"prod":"prod"}'
      build-themes: true
      deploy-branches: '["prod"]'
      image-name: 'ghcr.io/unb-libraries/womenactivists.lib.unb.ca'
      k8s-deployment-name: 'womenactivists-lib-unb-ca'
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}

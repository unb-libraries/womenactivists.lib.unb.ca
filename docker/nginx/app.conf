# nginx configuration for the generated (static) Nuxt site, derived from docker-nginx
# build/conf/nginx/app.conf.
#
# This REPLACES $NGINX_APP_CONF_FILE, the way docker-nginx-php does, rather than being a
# $NGINX_CONFD_DIR/server/*.conf snippet: the base app.conf includes snippets BEFORE its
# own `location /`, so a snippet redefining `location /` stops nginx starting on a
# duplicate location.
#
# Keep every UPPERCASE placeholder literal -- /scripts/pre-init.d/10_configure_nginx.sh
# substitutes them at container start.
#
# TODO: once a second Nuxt SSG site is converted, lift this into a shared
# ghcr.io/unb-libraries/nuxt-ssg base image so the /health contract below belongs to the
# image rather than to each app.

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  include NGINX_CONFD_SLUG/daemon/*.conf;

  server {
    listen 80 default_server;
    charset utf-8;
    server_name APP_HOSTNAME;

    root APP_WEBROOT;
    index index.html index.htm;

    access_log NGINX_LOG_FILE;
    error_log NGINX_ERROR_LOG_FILE warn;

    # Probe target for unblib-daemon-nuxt-ssg. Independent of try_files on purpose: these
    # probes are the only thing keeping pods in service.
    location = /health {
      access_log off;
      # Not add_header, which would append a second Content-Type.
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    include NGINX_CONFD_SLUG/server/*.conf;

    # Not the base image's fallback to /index.html, which would make every dead link a
    # soft 200. Some migrated cross-references are already 404 upstream.
    location / {
      try_files $uri $uri.html $uri/index.html =404;
      # Revalidate: stale HTML would request /_nuxt/ hashes the new image no longer has.
      add_header Cache-Control "public, no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
      # One explicit header, not `expires` plus add_header, which emit two competing values.
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      access_log off;
    }

    # Deny . (dot) file access
    location ~ (^|/)\. {
      return 403;
    }
  }
}

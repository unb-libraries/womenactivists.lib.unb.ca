services:
  womenactivists-lib-unb-ca:
    build:
      target: development
      context: .
    container_name: womenactivists-lib-unb-ca
    volumes:
      - ./.nuxt:/nuxt/.nuxt
      - ./app:/nuxt/app
      - ./content:/nuxt/content
      - ./public:/nuxt/public
      - ./content.config.ts:/nuxt/content.config.ts
      - ./nuxt.config.ts:/nuxt/nuxt.config.ts
      - ./package.json:/nuxt/package.json
      - ./pnpm-lock.yaml:/nuxt/pnpm-lock.yaml
    environment:
      NUXT_SITE_URI: ${NUXT_SITE_URI}
      NUXT_PORT: ${NUXT_PORT}
    ports:
      - '3085:3085'
      - '30850:30850'
    networks:
      - womenactivists.lib.unb.ca

networks:
  womenactivists.lib.unb.ca:
    name: womenactivists.lib.unb.ca
